# What staging could do to real people. Apply these fixes to every copy.
neutralise:
  - kind: payments
    where: "wp_actionscheduler_actions[woocommerce_scheduled_subscription_payment]"
    why: "6 subscription renewal payments are scheduled; staging would try to charge customers when they fall due"
    fix: "Cancel these actions in the copy, or make sure WooCommerce Subscriptions starts in staging mode"
  - kind: email
    where: "wp_options[wp_mail_smtp]"
    why: "Outgoing email is sent through WP Mail SMTP (mailer: sendgrid)"
    fix: "Point the mailer at a mail catcher such as Mailpit, or turn it off, in the copy"
  - kind: payments
    where: "wp_options[woocommerce_stripe_settings]"
    why: "Payment gateway \"stripe\" is enabled in live mode"
    fix: "Switch the gateway to test or sandbox mode and remove the live keys in the copy"
  - kind: webhooks
    where: wp_wc_webhooks
    why: "2 active webhooks would send order and customer data from staging to their delivery URLs"
    fix: "Set status to 'disabled' (or delete the rows) in the copy"
  - kind: backups
    where: "wp_options[updraft_service]"
    why: "UpdraftPlus backups are scheduled and go to Amazon S3; staging would send its backups there too"
    fix: "Remove the remote storage in UpdraftPlus's settings in the copy, or turn its backup schedule off"
  - kind: email
    where: wp_options
    why: "2 WooCommerce Memberships emails are enabled; staging would send them to members, for example when a membership ends"
    fix: "Turn these emails off in WooCommerce > Settings > Emails in the copy, or route mail to a catcher such as Mailpit"
  - kind: connection
    where: wp_options
    why: "The copy keeps the live site's Jetpack connection; connected services would act for the live site, and WooCommerce Shipping, Tax or Payments are active"
    fix: "Disconnect the copy: delete the blog token in jetpack_private_options and the auth entry in woocommerce_helper_data, or define JETPACK_STAGING_MODE in its wp-config.php"
  - kind: scheduled_jobs
    where: wp_actionscheduler_actions
    why: "40 pending scheduled actions would run on staging (most common: woocommerce_cleanup_draft_orders (20), wc-admin_import_orders (14), woocommerce_scheduled_subscription_payment (6))"
    fix: "Cancel pending actions in the copy, or turn off WP-Cron and Action Scheduler there"
  - kind: scheduled_jobs
    where: "wp_options[cron]"
    why: "5 WP-Cron events would run on staging, including UpdraftPlus backups, WPForms email summaries, WooCommerce usage tracking and Ultimate Member jobs (most common: um_daily_scheduled_events (1), updraft_backup (1), woocommerce_tracker_send_event (1))"
    fix: "Turn cron off on the copy's host (DISABLE_WP_CRON stops runs on page loads, not a system cron), and change the plugins' own settings, since they schedule their events again"
  - kind: email
    where: "wp_options[woocommerce_new_order_settings]"
    why: "WooCommerce emails store staff about new and cancelled orders; staging would email them too"
    fix: "Set these emails to off in WooCommerce > Settings > Emails in the copy, or route mail to a catcher such as Mailpit"
  - kind: email
    where: wp_options
    why: "1 plugin setting sends notification emails to staff addresses (for example fixture_admin_recipient)"
    fix: "Point these settings at a test address, or route mail to a catcher such as Mailpit, in the copy"
  - kind: email
    where: "wp_postmeta[_mail]"
    why: "1 Contact Form 7 form emails its submissions to the addresses in its settings"
    fix: "Route mail to a catcher such as Mailpit in the copy, or add demo_mode: on to each form's Additional Settings"
